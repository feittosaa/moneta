[package]
name = "moneta-desktop"
version = "1.4.5"
description = "Moneta: janela nativa que abre o painel e mantém o servidor local em segundo plano"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "moneta"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
