# Ao enviar uma tag de versão (por exemplo 1.0.0), roda os testes, gera o AppImage, o
# instalador do Windows e o APK do Android e publica tudo numa release do GitHub.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # Janela nativa do Windows (Tauri): compilada no próprio Windows e embutida no instalador.
  janela-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar moneta.exe
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: moneta-windows
          path: desktop/target/release/moneta.exe

  release:
    needs: janela-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: moneta-windows
          path: janela-windows

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes
        run: node --test test/*.test.mjs

      - name: Janela nativa do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Ferramentas de empacotamento
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Instaladores
        env:
          MONETA_DESKTOP_EXE: janela-windows/moneta.exe
          MONETA_DESKTOP_LINUX: desktop/target/release/moneta
        run: packaging/build.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A chave de assinatura fica nos segredos do repositório. Ela precisa ser sempre a mesma:
      # com outra chave, o Android recusa instalar a versão nova por cima da anterior.
      - name: APK do Android
        env:
          MONETA_VERSION: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.MONETA_ANDROID_KEYSTORE_BASE64 }}
          MONETA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MONETA_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Sem os segredos MONETA_ANDROID_KEYSTORE_BASE64 e MONETA_ANDROID_KEYSTORE_PASSWORD; a release sai sem o APK."
            exit 0
          fi
          sudo apt-get install -y zstd
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moneta.jks"
          MONETA_ANDROID_KEYSTORE="$RUNNER_TEMP/moneta.jks" android/build.sh
          rm -f "$RUNNER_TEMP/moneta.jks"
          (cd dist && sha256sum Moneta-x86_64.AppImage Moneta-Setup.exe install.sh Moneta-Android-arm64.apk > SHA256SUMS.txt)

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="packaging/notas/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Moneta ${GITHUB_REF_NAME#v}" "$@"
