<h2>Cofre neste aparelho</h2>
<p>Os lançamentos ficam cifrados neste aparelho. Guarde uma cópia do backup fora do navegador e use a senha do cofre para restaurá-la.</p>
<button id="web-lock" type="button">Trancar cofre</button>
<h2>Backup</h2>
<button id="web-backup" type="button">Baixar backup cifrado</button>
<form id="web-restore" class="backup-restore">
<label>Backup da Moneta Web <input type="file" name="backup" accept=".monetaweb" required></label>
<label>Senha do backup <input type="password" name="password" required autocomplete="off" maxlength="256"></label>
<button>Restaurar</button>
</form>
</section>
